<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" aria-label="Vastraa Luxury Ethnic Wear">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#C5A15B"/>
      <stop offset="100%" stop-color="#997736"/>
    </linearGradient>
  </defs>
  <!-- Decorative Heritage Paisley / Lotus Motif -->
  <g transform="translate(160, 20) scale(0.65)" stroke="url(#goldGrad)" fill="none" stroke-width="1.5">
    <path d="M0 -15 C6 -5 12 0 0 14 C-12 0 -6 -5 0 -15 Z" fill="#641E2B" opacity="0.15" />
    <path d="M0 -15 C6 -5 12 0 0 14 C-12 0 -6 -5 0 -15 Z" />
    <circle cx="0" cy="-2" r="2.5" fill="url(#goldGrad)" />
    <line x1="-18" y1="0" x2="-6" y2="0" stroke="url(#goldGrad)" stroke-width="1" />
    <line x1="6" y1="0" x2="18" y2="0" stroke="url(#goldGrad)" stroke-width="1" />
  </g>
  <!-- Wordmark in classical serif typography -->
  <text x="160" y="54" text-anchor="middle" font-family="'Cormorant Garamond', 'Didot', 'Bodoni MT', Georgia, serif" font-size="34" font-weight="600" letter-spacing="9" fill="#641E2B">VASTRAA</text>
  <!-- Subtitle -->
  <text x="160" y="70" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7.5" font-weight="500" letter-spacing="4.5" fill="#C5A15B">HERITAGE COUTURE</text>
</svg>
