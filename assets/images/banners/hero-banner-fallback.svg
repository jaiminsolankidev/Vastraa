      <stop offset="0%" stop-color="#4A141E"/>
      <stop offset="60%" stop-color="#2D0B12"/>
      <stop offset="100%" stop-color="#190509"/>
    </radialGradient>
    <pattern id="royalJaali" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M40 0 L80 40 L40 80 L0 40 Z" fill="none" stroke="#C5A15B" stroke-width="0.75" opacity="0.18"/>
      <circle cx="40" cy="40" r="4" fill="#C5A15B" opacity="0.25"/>
