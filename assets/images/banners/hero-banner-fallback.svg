    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DEB0"/>
      <stop offset="50%" stop-color="#C5A15B"/>
      <stop offset="100%" stop-color="#9C7838"/>
